<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CV Builder</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      body { width: 360px; padding: 14px; }
      header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
      header h1 { flex: 1; }
      .ghost { border: 0; background: none; color: var(--muted); padding: 4px; }
      textarea { height: 90px; resize: vertical; font-size: 12px; }
      details summary { cursor: pointer; font-size: 12px; font-weight: 600; color: #44403c; margin-top: 8px; }
      .check { display: flex; align-items: center; gap: 6px; font-weight: 500; }
      .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-top: 10px; background: #fafaf9; }
      #match { display: flex; gap: 10px; align-items: center; }
      #match[hidden] { display: none; }
      .score { font-size: 20px; font-weight: 700; min-width: 54px; text-align: center; }
      .score.good { color: #15803d; } .score.mid { color: #b45309; } .score.low { color: #b91c1c; }
      .actions { display: flex; gap: 8px; margin-top: 12px; }
      .actions button { flex: 1; }
      #message { margin: 10px 0 0; min-height: 1em; }
    </style>
  </head>
  <body>
    <header>
      <h1><span class="badge">CV</span> Save this job</h1>
      <button id="openSettings" class="ghost" type="button" title="Settings">Settings</button>
    </header>

    <section id="setup" hidden>
      <p id="setupText">Connect the extension to your account: create a key in <b>Account → Browser extension</b> and paste it in settings.</p>
      <p class="muted">You only do this once.</p>
    </section>

    <section id="main" hidden>
      <label for="title">Job title</label>
      <input id="title" type="text" maxlength="200" />
      <div class="row">
        <div><label for="company">Company</label><input id="company" type="text" maxlength="200" /></div>
        <div><label for="location">Location</label><input id="location" type="text" maxlength="200" /></div>
      </div>
      <div class="row">
        <div><label for="salary">Salary</label><input id="salary" type="text" maxlength="120" /></div>
        <div><label>&nbsp;</label><label class="check"><input id="remote" type="checkbox" /> Remote</label></div>
      </div>
      <label for="url">Link</label>
      <input id="url" type="url" maxlength="2000" />
      <details>
        <summary>Description <span id="descCount" class="muted"></span></summary>
        <textarea id="description" maxlength="30000" aria-label="Job description"></textarea>
      </details>

      <div class="card">
        <label for="cv" style="margin-top:0">Match against</label>
        <select id="cv"><option value="">Loading your CVs…</option></select>
        <div id="match" hidden>
          <div id="score" class="score"></div>
          <div id="missing" class="muted"></div>
        </div>
      </div>

      <div class="actions">
        <button id="fill" type="button" title="Shows what it will fill first; never submits">Fill application form</button>
        <button id="save" type="button" class="primary">Save to tracker</button>
      </div>
    </section>
    <p id="message" role="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
