<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CV Builder</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="common.css" />
    <style>
      body { width: 360px; background: var(--canvas); }
      header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: var(--appbar-bg); border-bottom: 1px solid var(--appbar-line); color: var(--appbar-ink); }
      header h1 { flex: 1; color: var(--appbar-ink); }
      header .mark .page { fill: var(--appbar-ink); }
      header .mark .line { stroke: var(--appbar-bg); }
      header .ghost { color: var(--appbar-ink-2); }
      header .ghost:hover { background: var(--appbar-hover); color: var(--appbar-ink); }
      main { padding: 4px 14px 14px; }
      section > p:first-child { margin-top: 12px; }
      textarea { height: 90px; resize: vertical; font-size: 12px; }
      details summary { cursor: pointer; margin-top: 10px; font: 560 13px/18px var(--font-sans); color: var(--ink-2); }
      .check { display: flex; align-items: center; gap: 8px; min-height: 36px; margin: 0; font-weight: 500; color: var(--ink); }
      .card { margin-top: 12px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); }
      #match { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
      #match[hidden] { display: none; }
      .score { min-width: 56px; padding: 4px 8px; border-radius: var(--radius-md); font: 680 20px/28px var(--font-display); font-variant-numeric: tabular-nums; text-align: center; }
      .score.good { color: var(--success); background: var(--success-soft); }
      .score.mid { color: var(--warning); background: var(--warning-soft); }
      .score.low { color: var(--danger); background: var(--danger-soft); }
      .actions { display: flex; gap: 8px; margin-top: 14px; }
      .actions button { flex: 1; }
      #message { margin: 10px 14px 14px; min-height: 1em; }
    </style>
  </head>
  <body>
    <header>
      <h1><svg class="mark" width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><path class="page" d="M8 3h12.5L27 9.5V26a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z"/><path class="fold" d="M20.5 3L27 9.5h-4.5a2 2 0 0 1-2-2z"/><path class="line" d="M10 16h9M10 21h6" fill="none" stroke-width="2.2" stroke-linecap="round"/></svg> Save this job</h1>
      <button id="openSettings" class="ghost" type="button" title="Settings">Settings</button>
    </header>

    <main>
    <section id="setup" hidden>
      <p id="setupText">Connect the extension to your account: create a key in <b>Account → Browser extension</b> and paste it in settings.</p>
      <p class="muted">You only do this once.</p>
    </section>

    <section id="main" hidden>
      <label for="title">Job title</label>
      <input id="title" type="text" maxlength="200" />
      <div class="row">
        <div><label for="company">Company</label><input id="company" type="text" maxlength="200" /></div>
        <div><label for="location">Location</label><input id="location" type="text" maxlength="200" /></div>
      </div>
      <div class="row">
        <div><label for="salary">Salary</label><input id="salary" type="text" maxlength="120" /></div>
        <div><label>&nbsp;</label><label class="check"><input id="remote" type="checkbox" /> Remote</label></div>
      </div>
      <label for="url">Link</label>
      <input id="url" type="url" maxlength="2000" />
      <details>
        <summary>Description <span id="descCount" class="muted"></span></summary>
        <textarea id="description" maxlength="30000" aria-label="Job description"></textarea>
      </details>

      <div class="card">
        <label for="cv" style="margin-top:0">Match against</label>
        <select id="cv"><option value="">Loading your CVs…</option></select>
        <div id="match" hidden>
          <div id="score" class="score"></div>
          <div id="missing" class="muted"></div>
        </div>
      </div>

      <div class="actions">
        <button id="fill" type="button" title="Shows what it will fill first; never submits">Fill application form</button>
        <button id="save" type="button" class="primary">Save to tracker</button>
      </div>
    </section>
    </main>
    <p id="message" role="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
